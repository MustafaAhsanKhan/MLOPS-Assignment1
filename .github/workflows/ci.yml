name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Build only. Images are published by the release workflow, never from a PR.
      - name: Build Docker image
        run: docker build -t student-ml-api:pr-${{ github.event.pull_request.number }} .

      - name: Smoke test container
        run: |
          docker run -d --name smoke-test -p 5000:5000 student-ml-api:pr-${{ github.event.pull_request.number }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 1
          done
          docker logs smoke-test
          exit 1
