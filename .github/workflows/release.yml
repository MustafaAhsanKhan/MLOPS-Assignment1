name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  publish:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v1.0.0 -> 1.0.0
          if [ "$VERSION" != "$(cat VERSION)" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($(cat VERSION))"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "GIT_SHA=$(git rev-parse HEAD)"
            # registry paths must be lowercase
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/student-ml-api"
          } >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg GIT_COMMIT="$GIT_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg REPOSITORY_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$VERSION" .

      - name: Apply version tags
        run: docker tag "$IMAGE:$VERSION" "$IMAGE:latest"

      - name: Push Docker image
        run: docker push --all-tags "$IMAGE"

      - name: Record image digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2}')
          echo "Published $IMAGE:$VERSION@$DIGEST"
          {
            echo "### Published \`$IMAGE\`"
            echo ""
            echo "- Tags: \`$VERSION\`, \`latest\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
